name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit & Integration Tests (Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cross-compile:
    name: Target aarch64 Cross-Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross-toolchain & sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-unknown-linux-gnu
      - name: Add aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary for aarch64
        run: cargo build --target aarch64-unknown-linux-gnu --release
      - name: Package Release Distribution
        run: |
          mkdir -p dist
          # Determine package version label
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PKG_VER="${GITHUB_REF_NAME}"
          else
            PKG_VER="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          fi
          PKG_NAME="ventop-ai-${PKG_VER}-aarch64-unknown-linux-gnu"
          
          # Create compressed tarball with binary and licensing documents
          tar -czvf "dist/${PKG_NAME}.tar.gz" \
            LICENSE ATTRIBUTION.md README.md \
            -C target/aarch64-unknown-linux-gnu/release ventop-ai
          
          # Generate SHA256 checksum
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          cd ..
          
          echo "Package created: dist/${PKG_NAME}.tar.gz"
          cat "dist/${PKG_NAME}.tar.gz.sha256"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ventop-ai-aarch64-release
          path: dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, security-audit, cross-compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ventop-ai-aarch64-release
          path: dist
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
