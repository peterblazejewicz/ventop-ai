[package]
name = "ventop-ai"
version = "0.3.9"
edition = "2021"
rust-version = "1.80"
authors = ["Piotr Błażejewicz (Peter Blazejewicz) <peterblazejewicz@users.noreply.github.com>"]
license = "MIT AND BSD-3-Clause"
description = "High-performance Dual-Brain system and Hexagon NPU monitor for Arduino Ventuno Q (Qualcomm Snapdragon QCS8275 + STM32H5)"
repository = "https://github.com/peterblazejewicz/ventop-ai"
homepage = "https://github.com/peterblazejewicz/ventop-ai"
readme = "README.md"
keywords = ["arduino", "ventuno-q", "qualcomm", "hexagon", "npu", "tui", "embedded"]
categories = ["command-line-utilities", "embedded"]
exclude = [".agents/"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.32"
anyhow = "1.0"
nix = { version = "0.31", default-features = false, features = ["user"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg()'] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
needless_borrows_for_generic_args = "warn"
collapsible_match = "warn"
redundant_closure = "warn"
print_literal = "allow" # Allow tabular columnar formatting in snapshot field dictionary
too_many_arguments = "allow" # Preserves existing TUI render function signatures

[profile.release]
lto = "fat"           # Enable link-time optimization
codegen-units = 1     # Better optimization, slower compile
opt-level = 3         # Maximum optimization
strip = true          # Strip symbols from binary
